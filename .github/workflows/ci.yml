# weather-order-assistant-system：只做 GitHub Actions CI，不連接 AWS / EC2。
# 本 workflow 會使用 GitHub Runner 的臨時 MySQL 執行測試，打包 JAR 並建置 Docker Image。
name: Weather Order Assistant - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 只需要讀取 Repository 程式碼，不授予寫入套件或部署權限。
permissions:
  contents: read

# 同一分支若快速連續推送，以最新一次為準，避免浪費 CI 額度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-package-docker:
    name: Maven test + JAR + Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # 以下帳密僅供 CI 當次執行的臨時 MySQL 使用，不得作為正式環境密碼。
    # CI 不載入本機 .env.docker，也不使用 AWS 金鑰或正式資料庫。
    env:
      DB_URL: 'jdbc:mysql://127.0.0.1:3306/weather_order_assistant_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei'
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_test_only_password
      CWA_API_KEY: ci-dummy-api-key
      APP_ADMIN_BOOTSTRAP: 'false'
      TZ: Asia/Taipei

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_root_password
          MYSQL_DATABASE: weather_order_assistant_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_test_only_password
          TZ: Asia/Taipei
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_test_only_root_password --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    steps:
      # 1. 下載當次 Push / PR 對應的專案原始碼。
      - name: Checkout source
        uses: actions/checkout@v6

      # 2. 安裝 Java 21 並快取 Maven 依賴，縮短後續 CI 時間。
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. 運行 JUnit / Mockito 測試與 Spring Boot 啟動測試。
      #    Spring Boot 啟動測試會連線上方的臨時 MySQL，並執行 Flyway。
      #    使用 bash 執行 mvnw，避免從 Windows 上傳後沒有 Linux 執行權限。
      - name: Maven test and package JAR
        run: bash ./mvnw -B -ntp clean package

      # 4. 確認 JAR 真的產生，避免誤將編譯成功當作打包成功。
      - name: Verify JAR exists
        run: test -f target/weather-order-assistant-system-0.0.1-SNAPSHOT.jar

      # 5. 使用專案既有 Dockerfile，驗證剛產生的 JAR 可以建置成 Docker Image。
      #    本步驟不啟動 EC2、不推送 Docker Hub，也不啟動正式服務。
      - name: Build Docker image
        run: docker build -t weather-order-assistant:ci .

      # 6. 確認 Image 已存在於 GitHub Runner（Runner 結束後即清除）。
      - name: Verify Docker image
        run: docker image inspect weather-order-assistant:ci > /dev/null

      # 7. 保存短期 JAR 成品，供 Actions 頁面手動下載。
      #    保存 3 天，降低 GitHub Artifact 儲存用量。
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: weather-order-assistant-jar
          path: target/weather-order-assistant-system-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  # 8. 手動建立並發布 GHCR Image：正常 push / pull_request 時不會執行。
  #    必須先完成上方測試、JAR 打包與 Docker Image 建置，才能進入發布工作。
  publish-ghcr:
    name: Publish image to GHCR (manual only)
    # 只允許從 main 分支手動執行；避免 Pull Request / Push 自動取得套件寫入權限。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test-package-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # 重新取得 Dockerfile 與 .dockerignore；不重新進行 Maven 打包。
      - name: Checkout source for image publishing
        uses: actions/checkout@v6

      # 下載「本次 CI 已完成測試」的 JAR，不使用上一個 Commit 的產物。
      # 上方 upload-artifact 的 path 是 target/xxx.jar，下載後還原至 target/。
      - name: Download tested JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: weather-order-assistant-jar
          path: target

      - name: Verify downloaded JAR
        run: test -f target/weather-order-assistant-system-0.0.1-SNAPSHOT.jar

      # OCI registry 名稱只能使用小寫；自動依當前 Repo 組合 ghcr.io/owner/repo。
      - name: Prepare lowercase GHCR image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "GHCR Image: ${IMAGE_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 使用 GitHub 自動提供的 GITHUB_TOKEN，不必建立個人 PAT，也不用 AWS 金鑰。
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile 直接 COPY 本次測試成功的 JAR，完成後發布版本化與 latest Image。
      # 平台固定為 linux/amd64，對應一般 x86_64 EC2 主機；未來如改 ARM 再調整。
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 在 GitHub Runner 上從 GHCR 真正下載剛發布的 Image，驗證 Registry 可讀取。
      # 這不會啟動 EC2、MySQL 或使用 AWS。
      - name: Verify image can be pulled from GHCR
        shell: bash
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > /dev/null
          echo "GHCR image published and verified: $IMAGE"
