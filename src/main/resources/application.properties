# 專案名稱
spring.application.name=weather-order-assistant-system

# 載入專案根目錄的 .env，並以 properties 格式解析
spring.config.import=optional:file:.env[.properties]

# MySQL 資料庫連線設定
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:weather_order_assistant_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL 登入帳號與密碼
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway 資料庫版本管理
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA 設定
# 只檢查資料表結構是否符合 Entity，不自動更新；資料表版本由 Flyway 管理
spring.jpa.hibernate.ddl-auto=validate

# 顯示 SQL 執行語句
# 把 Hibernate 執行的 SQL 印到 console
spring.jpa.show-sql=true

# 把印出來的 SQL 排版，變得比較好讀
spring.jpa.properties.hibernate.format_sql=true

# 商品圖片儲存資料夾
app.upload.product-image-dir=uploads/products
# 單一檔案最大容量
spring.servlet.multipart.max-file-size=5MB
# 單次請求最大容量
spring.servlet.multipart.max-request-size=5MB

# 中央氣象署 API 設定
cwa.api.base-url=https://opendata.cwa.gov.tw/api/v1/rest/datastore/
cwa.api.authorization=${CWA_API_KEY}
# Spring Security：單一帳號 Session 閒置 20 分鐘後失效。
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 本機 http 測試為 false，部署正式 HTTPS 環境必須設定 SESSION_COOKIE_SECURE=true。
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# P1：部署健康檢查只公開 health，避免顯示內部檢查項目與敏感資訊。
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
# readiness 包含 MySQL；資料庫不可用時不應判斷為可以接收請求。
management.endpoint.health.group.readiness.include=readinessState,db

# P1：中央氣象署連線逾時（毫秒），避免上游延遲一直占用請求執行緒。
cwa.api.connect-timeout-ms=5000
cwa.api.read-timeout-ms=10000
